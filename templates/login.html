{% extends "base.html" %}
{% block title %}Login - JK-BMS Monitor{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1>JK-BMS Monitor</h1>
        <p class="login-subtitle">Battery Management System</p>
        <form method="POST" action="{{ url_for('login_page') }}">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
    </div>
</div>
{% endblock %}
