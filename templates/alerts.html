{% extends "base.html" %}
{% block title %}Alerts - JK-BMS Monitor{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Alerts</h1>
    <button class="btn btn-danger btn-sm" onclick="clearAllAlerts()">Clear All</button>
</div>

<div id="alerts-container">Loading...</div>

<script>
async function loadAlerts() {
    try {
        const resp = await fetch('/api/alerts');
        const container = document.getElementById('alerts-container');

        if (!resp.ok) {
            container.innerHTML = '<p class="empty-state">No alerts recorded.</p>';
            return;
        }

        const alerts = await resp.json();
        if (!alerts || alerts.length === 0) {
            container.innerHTML = '<p class="empty-state">No alerts recorded.</p>';
            return;
        }

        let html = `<div class="alerts-table"><table>
            <thead><tr><th>Time</th><th>Device</th><th>Level</th><th>Message</th><th></th></tr></thead>
            <tbody>`;

        for (const a of alerts) {
            html += `<tr>
                <td class="alert-time">${a.timestamp}</td>
                <td>${a.device_name || a.device_address}</td>
                <td><span class="badge badge-${a.level}">${a.level}</span></td>
                <td>${a.message}</td>
                <td><button class="btn btn-danger btn-xs" onclick="deleteAlert(${a.id})">X</button></td>
            </tr>`;
        }

        html += `</tbody></table></div>`;
        container.innerHTML = html;
    } catch(e) {
        document.getElementById('alerts-container').innerHTML = '<p class="empty-state">Error loading alerts.</p>';
    }
}

async function deleteAlert(id) {
    try {
        await fetch(`/api/alerts/${id}`, { method: 'DELETE' });
        loadAlerts();
    } catch(e) { alert('Error deleting alert'); }
}

async function clearAllAlerts() {
    if (!confirm('Delete all alerts?')) return;
    try {
        await fetch('/api/alerts', { method: 'DELETE' });
        loadAlerts();
    } catch(e) { alert('Error clearing alerts'); }
}

loadAlerts();
setInterval(loadAlerts, 10000);
</script>
{% endblock %}
