{% extends "base.html" %}
{% block title %}Settings - JK-BMS Monitor{% endblock %}
{% block content %}
<h1>Settings</h1>

<div class="panel settings-section">
    <div class="panel-title"><h2>Change Password</h2></div>
    <form method="POST" action="{{ url_for('settings_page') }}" class="settings-form">
        <input type="hidden" name="action" value="change_password">
        <div class="form-group">
            <label for="old_password">Current Password</label>
            <input type="password" id="old_password" name="old_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>
        <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
</div>

<div class="panel settings-section">
    <div class="panel-title"><h2>Alert Configuration</h2></div>
    <form method="POST" action="{{ url_for('settings_page') }}" class="settings-form">
        <input type="hidden" name="action" value="update_config">
        <div class="form-group">
            <label for="n_hours">Alert Cooldown (hours)</label>
            <input type="number" id="n_hours" name="n_hours" value="{{ config.n_hours if config else 12 }}" min="1" max="168">
            <span class="form-hint">Minimum hours between duplicate alerts for the same device and error code.</span>
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
</div>
{% endblock %}
